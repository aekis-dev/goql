site_name: goql
site_description: An ORM for Go where queries are written as ordinary Go functions.
site_url: https://goql.readthedocs.io/
repo_url: https://github.com/aekis-dev/goql
repo_name: aekis-dev/goql
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # Suffix structure: index.md is English, index.es.md is its Spanish sibling. English is
  # the default, so its pages keep the plain filenames and the untranslated site is
  # unaffected.
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          site_name: goql
          site_description: Un ORM para Go donde las consultas se escriben como funciones Go.
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Core concepts: Conceptos básicos
            "Lambdas are parsed, not executed": "Las lambdas se analizan, no se ejecutan"
            Declaring models: Declarar modelos
            Runtime values (params): Valores en tiempo de ejecución (params)
            Writing queries: Escribir consultas
            Struct calls (by example): Llamadas con structs (por ejemplo)
            Predicates and conditions: Predicados y condiciones
            Query options: Opciones de consulta
            Relations and preloading: Relaciones y precarga
            Joins: Joins
            Expressions: Expresiones
            Aggregates and projections: Agregados y proyecciones
            Grouping and HAVING: Agrupación y HAVING
            Subqueries: Subconsultas
            Set operations: Operaciones de conjuntos
            Common table expressions: Expresiones de tabla común
            Recursive queries: Consultas recursivas
            "INSERT … SELECT": "INSERT … SELECT"
            Raw SQL: SQL directo
            Operations: Operación
            Transactions: Transacciones
            Dialects and portability: Dialectos y portabilidad
            Migrations: Migraciones
            Production builds: Compilaciones de producción
            Reference: Referencia
            Errors: Errores
            Limitations: Limitaciones

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Core concepts:
      - Lambdas are parsed, not executed: lambdas.md
      - Declaring models: models.md
      - Runtime values (params): params.md
  - Writing queries:
      - Struct calls (by example): struct-calls.md
      - Predicates and conditions: predicates.md
      - Query options: options.md
      - Relations and preloading: relations.md
      - Joins: joins.md
      - Expressions: expressions.md
      - Aggregates and projections: aggregates.md
      - Grouping and HAVING: grouping.md
      - Subqueries: subqueries.md
      - Set operations: set-operations.md
      - Common table expressions: cte.md
      - Recursive queries: recursive.md
      - INSERT … SELECT: insert-select.md
      - Raw SQL: raw-sql.md
  - Operations:
      - Transactions: transactions.md
      - Dialects and portability: dialects.md
      - Migrations: migrations.md
      - Production builds: production.md
  - Reference:
      - Errors: errors.md
      - Limitations: limitations.md
